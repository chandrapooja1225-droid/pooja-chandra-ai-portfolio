<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Uthej ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: linear-gradient(to top, #1f4037, #99f2c8);
    }

    .background {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, rgba(0,0,0,0.15), rgba(255,255,255,0.1)),
        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;
      animation: zoomBg 20s ease-in-out infinite alternate;
      filter: brightness(0.9);
    }

    @keyframes zoomBg {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.25);
    }

    .content {
      position: relative;
      text-align: center;
      color: white;
      z-index: 2;
      padding: 30px;
      max-width: 800px;
      animation: fadeIn 2s ease;
    }

    .welcome {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .name {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(3rem, 9vw, 6rem);
      color: #ffe9a8;
      margin-top: 10px;
      text-shadow: 0 4px 25px rgba(0,0,0,0.45);
      animation: glow 3s infinite alternate;
    }

    .message {
      margin-top: 20px;
      font-size: clamp(1.3rem, 3vw, 2rem);
      font-weight: 300;
      text-shadow: 0 3px 15px rgba(0,0,0,0.35);
    }

    .heart {
      display: inline-block;
      animation: heartbeat 1.5s infinite;
    }

    .road {
      position: absolute;
      bottom: -5%;
      left: 50%;
      width: 35%;
      height: 50%;
      transform: translateX(-50%);
      background: linear-gradient(to top, #2c2c2c, #4d4d4d);
      clip-path: polygon(40% 100%, 60% 100%, 100% 0%, 0% 0%);
      opacity: 0.55;
      z-index: 1;
    }

    .sun {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff7b2, #ffb347);
      box-shadow: 0 0 80px rgba(255, 196, 0, 0.8);
      z-index: 0;
      animation: sunrise 8s ease-in-out infinite alternate;
    }

    @keyframes sunrise {
      from { transform: translateX(-50%) translateY(10px); }
      to { transform: translateX(-50%) translateY(-15px); }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px rgba(255,233,168,0.6); }
      to { text-shadow: 0 0 30px rgba(255,233,168,1); }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .floating-hearts span {
      position: absolute;
      color: rgba(255,255,255,0.8);
      font-size: 22px;
      animation: floatUp linear infinite;
    }

    .floating-hearts span:nth-child(1) {
      left: 10%;
      animation-duration: 9s;
      animation-delay: 0s;
    }

    .floating-hearts span:nth-child(2) {
      left: 25%;
      animation-duration: 12s;
      animation-delay: 2s;
    }

    .floating-hearts span:nth-child(3) {
      left: 50%;
      animation-duration: 10s;
      animation-delay: 1s;
    }

    .floating-hearts span:nth-child(4) {
      left: 75%;
      animation-duration: 11s;
      animation-delay: 3s;
    }

    .floating-hearts span:nth-child(5) {
      left: 90%;
      animation-duration: 8s;
      animation-delay: 1s;
    }

    .floating-hearts span:nth-child(6) {
      left: 35%;
      animation-duration: 13s;
      animation-delay: 2s;
    }

    .floating-hearts span:nth-child(7) {
      left: 65%;
      animation-duration: 9s;
      animation-delay: 4s;
    }

    @keyframes floatUp {
      from {
        bottom: -10%;
        opacity: 0;
        transform: translateX(0) rotate(0deg);
      }
      20% {
        opacity: 1;
      }
      to {
        bottom: 110%;
        opacity: 0;
        transform: translateX(40px) rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="background"></div>
  <div class="overlay"></div>
  <div class="sun"></div>
  <div class="road"></div>

  <div class="floating-hearts">
    <span>❤️</span>
    <span>💖</span>
    <span>💕</span>
    <span>💘</span>
    <span>😘</span>
    <span>💋</span>
  </div>

  <div class="content">
    <div class="welcome">Welcome Uthej ❤️</div>
    <div class="message">
      Love You ✨
    </div>
  </div>
</body>
</html>
